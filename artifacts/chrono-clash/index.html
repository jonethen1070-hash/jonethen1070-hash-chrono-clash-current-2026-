<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#04040c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>CHRONO CLASH</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%04040c'/%3E%3Cpath d='M32 10 L38 32 L32 54 L26 32 Z' fill='%23c4b5fd'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/game.css" />
    <link rel="stylesheet" href="/src/styles/studio.css" />
    <link rel="stylesheet" href="/src/styles/aaa-polish.css" />
    <!-- match-frame: board hardware only. hud-redesign: match HUD cosmetics (loaded last). -->
    <link rel="stylesheet" href="/src/styles/match-frame.css" />
    <link rel="stylesheet" href="/src/styles/hud-redesign.css" />
  </head>
  <body>
    <div id="app"></div>
    <script>
      (function () {
        var local = location.hostname === "127.0.0.1" || location.hostname === "localhost";
        if (local && typeof window.ChronoRewardedAds === "undefined") {
          window.ChronoRewardedAds = {
            show: function () {
              var bytes = new Uint8Array(18);
              if (window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(bytes);
              else for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
              var id = Array.from(bytes, function (b) { return b.toString(16).padStart(2, "0"); }).join("");
              return Promise.resolve({ receiptId: id });
            },
          };
        }
        if (!location.hash.includes("id_token=")) return;
        var token = new URLSearchParams(location.hash.replace(/^#/, "")).get("id_token");
        if (!token) return;
        try {
          sessionStorage.setItem("chrono-clash-google-id-token", token);
        } catch (e) {
          /* ignore */
        }
        if (!window.opener || window.opener === window) {
          history.replaceState(null, "", location.pathname + location.search);
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
