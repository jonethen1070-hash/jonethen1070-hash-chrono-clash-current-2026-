# Chrono Clash — Render Blueprint for the Guest-vs-Guest public test.
# Repo root is this project (jonethen1070-hash/chrono-clash). Do not set rootDir.
# One Node web service serves the Vite client (dist/) and the /v1 API on the same origin.
# Provider client IDs are omitted. Guest stays on for this test.
# Production provider credentials are configured later via CHRONO_AUTH_MODE=production.
services:
  - type: web
    name: chrono-clash
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /v1/health
    disk:
      name: chrono-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CHRONO_AUTH_MODE
        value: development
      - key: CHRONO_ALLOW_GUEST
        value: "1"
      - key: CHRONO_ALLOW_DEV_AUTH
        value: "0"
      - key: CHRONO_STATIC_DIR
        value: dist
      - key: CHRONO_DB
        value: /var/data/chrono.db
      - key: CHRONO_SESSION_TTL_MS
        value: "2592000000"
      - key: CHRONO_MAX_SESSIONS
        value: "8"
